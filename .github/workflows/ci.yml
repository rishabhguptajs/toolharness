name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy agent_eval_harness
      - name: Test (pytest)
        run: pytest -q
      # Smoke-test the CI gate end to end: an unsafe run must fail its safety gate.
      # `|| true` is intentional — we assert the *non-zero* exit below.
      - name: CLI gate smoke test
        run: |
          set +e
          evalharness run tests/fixtures/m8_unsafe_call_fail.json --fail-under-mode UNSAFE_CALL=90
          code=$?
          set -e
          test "$code" -eq 1 || (echo "expected exit 1 from safety gate, got $code" && exit 1)
