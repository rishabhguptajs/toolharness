[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Scores tool-call reliability for agentic coding CLIs (Claude Code, Cursor, Codex, Gemini)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rishabh" }]
keywords = ["llm", "agents", "evaluation", "tool-calling", "reliability"]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
evalharness = "agent_eval_harness.runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_eval_harness"]
# Ship the bundled task suite (task.yaml + seed repos) and HTML templates as data.
artifacts = [
    "agent_eval_harness/suite/tasks/**",
    "agent_eval_harness/report/html/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The bundled task suite ships starting repos (seed/) as data, not library code —
# they are deliberately minimal/imperfect (that's the point), so don't lint them.
extend-exclude = ["agent_eval_harness/suite/tasks/*/seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
