[build-system]
# >=1.27 for PEP 639 `license`/`license-files` support.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evalharness"
version = "0.1.0"
description = "Scores tool-call reliability for agentic coding CLIs (Claude Code, Cursor, Codex, Gemini)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rishabh Gupta" }]
keywords = ["llm", "agents", "evaluation", "tool-calling", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/rishabhguptajs/evalharness"
Source = "https://github.com/rishabhguptajs/evalharness"
Issues = "https://github.com/rishabhguptajs/evalharness/issues"
Changelog = "https://github.com/rishabhguptajs/evalharness/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
evalharness = "evalharness.runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["evalharness"]
# Ship the bundled task suite (task.yaml + seed repos) and HTML templates as data.
artifacts = [
    "evalharness/suite/tasks/**",
    "evalharness/report/html/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# The bundled task suite ships starting repos (seed/) as data, not library code —
# they are deliberately minimal/imperfect (that's the point), so don't lint them.
extend-exclude = ["evalharness/suite/tasks/*/seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
